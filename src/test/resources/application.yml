spring:
  profiles:
    active: test
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        show_sql: true
        format_sql: true
        use_sql_comments: true
    defer-datasource-initialization: true
  # 테스트는 각자 필요한 데이터를 직접 만든다. dev 시드가 섞이면 건수 단언이 시드에 끌려다닌다.
  sql:
    init:
      mode: never

# 정기 동기화는 실제 외부 API를 호출한다. 테스트 실행 중 cron이 걸리면 안 되므로 끈다.
holiday:
  sync:
    scheduled:
      enabled: false
