# 운영 배포 구성 (docs/DEPLOYMENT.md §2) — 루트 docker-compose.yml(로컬 개발용 MySQL)과 별개.
#
# 사용법 (서버에서):
#   1. frontend 빌드 산출물(dist/)을 이 파일 옆의 ./dist 로 배치 (rsync)
#   2. 시크릿은 이 파일 옆의 .env (gitignored) 로만 주입:
#      APP_IMAGE, DB_URL, DB_USERNAME, DB_PASSWORD, PUBLIC_API_SERVICE_KEY, ADMIN_PASSWORD_HASH
#      — 로컬용 고정 비밀번호(office_password 등)를 운영에 재사용하지 않는다 (§4)
#   3. docker compose -f docker-compose.prod.yml up -d
#
# DB 는 관리형(RDS 등)을 권장한다. 불가하면 mysql 서비스를 여기에 추가하되
# 반드시 볼륨 + mysqldump 일일 크론 백업을 붙인다 (§2 선택 근거).
# 프론트만 배포할 때는 dist 교체 후 `docker compose exec nginx nginx -s reload`
# — 백엔드 재시작(=전 직원 세션 로그아웃) 없이 무중단.

services:
  nginx:
    image: nginx:1.27
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./dist:/srv/office-commute/dist:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - app

  app:
    # 이미지 태그는 커밋 SHA — 롤백은 이전 태그로 up -d (§3)
    image: ${APP_IMAGE:-office-commute:latest}
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      PUBLIC_API_SERVICE_KEY: ${PUBLIC_API_SERVICE_KEY}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH}
    volumes:
      - app-logs:/app/logs

volumes:
  app-logs:
