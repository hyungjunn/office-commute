# office-commute 리버스 프록시 (docs/DEPLOYMENT.md §2)
# 라우팅 규칙은 이 한 줄이 전부다: /api/** → 백엔드, 나머지 → SPA.
# server_name 과 인증서 경로만 배포 대상 도메인으로 바꾼다 (Let's Encrypt/certbot).

server {
    listen 443 ssl;
    server_name office-commute.example.com;

    ssl_certificate     /etc/letsencrypt/live/office-commute.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/office-commute.example.com/privkey.pem;

    root /srv/office-commute/dist;

    location /api/ {
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri /index.html;   # SPA fallback
    }
}

server {
    listen 80;
    server_name office-commute.example.com;
    return 301 https://$host$request_uri;
}
