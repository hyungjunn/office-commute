# office-commute 리버스 프록시 — 서버 실물과 동일하게 유지한다 (docs/DEPLOYMENT.md §2).
# 라우팅 규칙은 이 한 줄이 전부다: /api/** → 백엔드, 나머지 → SPA.
# 도메인 2개를 서빙한다: office-commute.com(주) + 13-125-8-177.sslip.io(레거시 — 이력서 제출 URL 유지).
# 인증서는 도메인별로 발급되어 있고(Let's Encrypt), 갱신은 webroot(-w dist) + deploy-hook nginx reload.

server {
    listen 443 ssl;
    server_name office-commute.com;

    ssl_certificate     /etc/letsencrypt/live/office-commute.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/office-commute.com/privkey.pem;

    root /srv/office-commute/dist;

    location /api/ {
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri /index.html;   # SPA fallback
    }
}

server {
    listen 443 ssl;
    server_name 13-125-8-177.sslip.io;

    ssl_certificate     /etc/letsencrypt/live/13-125-8-177.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/13-125-8-177.sslip.io/privkey.pem;

    root /srv/office-commute/dist;

    location /api/ {
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri /index.html;   # SPA fallback
    }
}

server {
    listen 80;
    server_name office-commute.com 13-125-8-177.sslip.io;
    return 301 https://$host$request_uri;
}
