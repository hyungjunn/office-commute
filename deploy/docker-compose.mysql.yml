# 관리형 DB(RDS)를 쓸 수 없을 때 docker-compose.prod.yml 에 겹쳐 쓰는 오버레이 (§2 선택 근거).
#   docker compose -f docker-compose.prod.yml -f docker-compose.mysql.yml up -d
# .env 에 DB_ROOT_PASSWORD 추가 필요. DB_URL 은 컨테이너 네트워크 기준:
#   jdbc:mysql://mysql:3306/office_commute?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
# 3306 은 호스트에 publish 하지 않는다 — app 만 내부 네트워크로 접근.
# 반드시 mysqldump 일일 크론 백업을 붙인다 (DEPLOYMENT.md §5).

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: office_commute
      MYSQL_USER: ${DB_USERNAME:?DB_USERNAME is required}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      timeout: 3s
      retries: 12

  app:
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql-data:
